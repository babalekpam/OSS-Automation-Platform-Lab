[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-lab"
version = "0.1.0"
description = "Carrier OSS automation reference lab: orchestration, N/N+1 validation, onboarding, AI-assisted engineering"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "uvicorn>=0.29",
  "scikit-learn>=1.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
oss-lab-validate = "oss_lab.validation.cli:main"
oss-lab-onboard = "oss_lab.onboarding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
